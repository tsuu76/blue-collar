<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}IT Job Hunter{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">IT Job Hunter</a>
  <div class="topbar-actions">
    <form method="post" action="{{ url_for('discover_now') }}">
      <button class="discover-button" type="submit" title="Check every enabled employer in config/employers.json for new jobs, then run them through the pipeline">Run discovery</button>
    </form>
    <a class="import-link" href="{{ url_for('import_job') }}">+ Import job</a>
  </div>
</header>

{% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="flash-container">
    {% for message in messages %}
    <div class="flash">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
